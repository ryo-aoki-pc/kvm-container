# drop-in for virt{qemu,network,storage,nodedev,secret}d.socket (installed by the Containerfile).
# Under socket activation these settings, not unix_sock_group/unix_sock_rw_perms in /etc/libvirt/*.conf, decide who can
# connect. libvirt's default is 0666 + polkit; the GUI container connects from another pid namespace where polkit cannot
# identify the client (libvirt-conf sets auth_unix_rw = "none"), so restrict the socket to the libvirt group instead.
# The group's gid is fixed in the Containerfile so that it is the same in the GUI image
[Socket]
SocketMode=0660
SocketGroup=libvirt
